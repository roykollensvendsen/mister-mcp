# Every rule this project enforces, and the one line that carries it.
#
# A rule nothing catches is a rule nothing protects. `scripts/mutate.py` turns
# each of these off in turn and runs the suite; a rule whose removal breaks no
# test has no test. Add a test of your own that counts the rules in the source
# against the rows here, so this list cannot fall behind.
#
# `find` is a regular expression matching the single line to replace; `replace`
# is what replaces it, keeping the file valid. The line's own indentation is
# kept, so do not write indentation here.
#
# [[rule]]
# name = "what the rule says, in words"
# file = "src/mister_mcp/somewhere.py"
# find = 'if limit_exceeded:'
# replace = 'if False:'

[[rule]]
name = "a commit message never links to a Claude session"
file = "scripts/no_session_links.py"
find = 'if SESSION\.search\(message\):'
replace = 'if False:'

[[rule]]
name = "a home-network address is never committed"
file = "scripts/private_data_scan.py"
find = 'found \+= \[f"home-network address \{m\}" for m in PRIVATE_IPV4\.findall\(text\)\]'
replace = 'pass'

[[rule]]
name = "a value from the settings file is never committed"
file = "scripts/private_data_scan.py"
find = 'found \+= \[f"a value from \{SETTINGS\.name\}" for s in secrets if s in text\]'
replace = 'pass'

[[rule]]
name = "only an allow-listed call is ever sent"
file = "src/mister_mcp/zaparoo.py"
find = 'if method not in ALLOWED_METHODS:'
replace = 'if False:'

[[rule]]
name = "a core is started only by a system Zaparoo listed"
file = "src/mister_mcp/zaparoo.py"
find = 'if system_id not in systems or not _SYSTEM_ID\.fullmatch\(system_id\):'
replace = 'if False:'

[[rule]]
name = "a game is started only by the text its search result gave"
file = "src/mister_mcp/zaparoo.py"
find = 'if not _GAME_TEXT\.fullmatch\(zapscript\):'
replace = 'if False:'

[[rule]]
name = "every start is sent as from a remote source"
file = "src/mister_mcp/zaparoo.py"
find = 'await self\.call\("run", \{"text": text, "unsafe": True\}, wait=RUN_WAIT\)'
replace = 'await self.call("run", {"text": text}, wait=RUN_WAIT)'

[[rule]]
name = "a mister that does not answer is not called on or off"
file = "src/mister_mcp/service.py"
find = 'return _unreachable\(error, on=None, system=None, game=None\)'
replace = 'return {"success": True, "outcome": "done", "say": "The MiSTer is off.", "on": False, "system": None, "game": None}'

[[rule]]
name = "a key file others can read is refused"
file = "src/mister_mcp/settings.py"
find = 'if path\.stat\(\)\.st_mode & \(stat\.S_IRWXG \| stat\.S_IRWXO\):'
replace = 'if False:'

[[rule]]
name = "a tool still working at the deadline says it carries on"
file = "src/mister_mcp/server.py"
find = 'answer = await asyncio\.wait_for\(asyncio\.shield\(work\), ANSWER_WITHIN\)'
replace = 'answer = await work'

[[rule]]
name = "every tool answers with a sentence, even when it fails"
file = "src/mister_mcp/server.py"
find = 'answer = \{"success": False, "outcome": "refused", "say": BROKE\}'
replace = 'raise'

[[rule]]
name = "every simulated answer says simulated first"
file = "src/mister_mcp/server.py"
find = 'if self\._simulated:'
replace = 'if False:'

[[rule]]
name = "only the tv status and input tools are ever called"
file = "src/mister_mcp/tv.py"
find = 'if tool not in self\.TOOLS:'
replace = 'if False:'

[[rule]]
name = "a tv that is not on is never sent an input"
file = "src/mister_mcp/tv.py"
find = 'if screen_of\(report, self\.tv\) != "on":'
replace = 'if False:'

[[rule]]
name = "the tv is touched only once the game started"
file = "src/mister_mcp/service.py"
find = 'if not started\["success"\] or self\.tv is None:'
replace = 'if self.tv is None:'

[[rule]]
name = "a start is said as done only once the mister shows it"
file = "src/mister_mcp/service.py"
find = '^        if _shows\(active, start\):$'
replace = '        if True:'

[[rule]]
name = "a measure that gets worse fails the check"
file = "scripts/ratchet.py"
find = 'if _worse\(metric, base\[metric\], now\[metric\]\) and metric not in allowed:'
replace = 'if False:'

[[rule]]
name = "when the levels main kept are missing, the base is measured"
file = "scripts/ratchet.py"
find = '^    return measure_base\(\)$'
replace = 'return {}'

[[rule]]
name = "a mister that answers without zaparoo is called on"
file = "src/mister_mcp/service.py"
find = 'return _unreachable\(error, on=True, system=None, game=None\)'
replace = 'return _unreachable(error, on=None, system=None, game=None)'

[[rule]]
name = "every ssh call runs in batch mode"
file = "src/mister_mcp/ssh.py"
find = 'batch = \["-o", "BatchMode=yes"\]'
replace = 'batch = ["-o", "BatchMode=no"]'

[[rule]]
name = "a missing key is said in the owners words"
file = "src/mister_mcp/ssh.py"
find = 'if any\(sign in said for sign in _ASKS_FOR_A_PASSWORD\):'
replace = 'if False:'

[[rule]]
name = "addresses are tried in the order the settings give"
file = "src/mister_mcp/zaparoo.py"
find = 'order = list\(self\._addresses\)'
replace = 'order = list(reversed(self._addresses))'

[[rule]]
name = "a slow launch is never asked for again"
file = "src/mister_mcp/server.py"
find = 'working=LAUNCH_WORKING,'
replace = 'working=WORKING,'

[[rule]]
name = "a module that reaches up a layer fails the check"
file = "scripts/ratchet.py"
find = 'if used in layers and layers\[used\] >= layers\[name\]$'
replace = 'if used in layers and layers[used] < layers[name]'

[[rule]]
name = "a running game is never ended without a yes"
file = "src/mister_mcp/service.py"
find = 'if active:$'
replace = 'if False:'

[[rule]]
name = "a token works once and only while fresh"
file = "src/mister_mcp/service.py"
find = 'if asked is None or self\._clock\(\) > asked\[1\]:'
replace = 'if asked is None:'

[[rule]]
name = "the tv plugin is closed after every use, even a slow one"
file = "src/mister_mcp/tv.py"
find = 'await tv\.__aexit__\(None, None, None\)'
replace = 'await asyncio.sleep(0)'

[[rule]]
name = "never a password login"
file = "src/mister_mcp/ssh.py"
find = '"PasswordAuthentication=no",'
replace = '"PasswordAuthentication=yes",'

[[rule]]
name = "zaparoos own words are never read aloud"
file = "src/mister_mcp/service.py"
find = 'say = REFUSALS\.get\(error\.category or "", REFUSED\)'
replace = 'say = f"{error}. " + REFUSALS.get(error.category or "", REFUSED)'

[[rule]]
name = "a pin that is not six digits is never sent"
file = "src/mister_mcp/pairing.py"
find = '    if not _PIN\.fullmatch\(pin\):'
replace = '    if False:'

[[rule]]
name = "a server that cannot prove the pin is never trusted"
file = "src/mister_mcp/pairing.py"
find = '    if not hmac\.compare_digest\(expected, base64\.b64decode\(finished\.get\("confirm", ""\)\)\):'
replace = '    if False:'

[[rule]]
name = "the pairing key is kept where only the owner can read it"
file = "src/mister_mcp/pairing.py"
find = '    os\.fchmod\(descriptor, 0o600\)'
replace = '    os.fchmod(descriptor, 0o644)'

[[rule]]
name = "the pin is typed by the owner and never shown"
file = "src/mister_mcp/cli.py"
find = '        pin = getpass\.getpass\(ASK_PIN\)\.strip\(\)'
replace = '        pin = input(ASK_PIN).strip()'

[[rule]]
name = "a frame that does not decrypt is never believed"
file = "src/mister_mcp/pairing.py"
find = '            return self\._in\.open\(base64\.b64decode\(frame\["e"\]\)\)\.decode\(\)'
replace = '            return base64.b64decode(frame["e"]).decode(errors="replace")'

[[rule]]
name = "a refused login is said as needing pairing"
file = "src/mister_mcp/zaparoo.py"
find = '        if _refusal\(raw\):'
replace = '        if False:'

[[rule]]
name = "only a command from the fixed list is ever sent over ssh"
file = "src/mister_mcp/ssh.py"
find = '        if name not in ALLOWED_COMMANDS:'
replace = '        if False:'

[[rule]]
name = "a full sd card is said in plain words"
file = "src/mister_mcp/updater.py"
find = '    if "is FULL" in text:'
replace = '    if False:'

[[rule]]
name = "an update token works once and only while fresh"
file = "src/mister_mcp/updater.py"
find = '        if until is None or self\._clock\(\) > until:'
replace = '        if until is None:'

[[rule]]
name = "too little free space is refused naming how much is free"
file = "src/mister_mcp/updater.py"
find = '        if mb < MIN_FREE_MB:'
replace = '        if mb < 0:'

[[rule]]
name = "a run already going is not started again"
file = "src/mister_mcp/updater.py"
find = '        if \(await self\._shell\.run\("running"\)\)\.code == 0:'
replace = '        if False:'

[[rule]]
name = "a running game is named in the question"
file = "src/mister_mcp/updater.py"
find = '        if active:'
replace = '        if False:'
